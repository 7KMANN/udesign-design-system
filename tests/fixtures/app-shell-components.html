<!DOCTYPE html>
<!-- S2 acceptance page, operations half: every shipped component class in AppShell.
     Placeholder data, no real orders. tests/checker.test.mjs holds it at zero findings. -->
<html lang="en" data-design="operations" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Queue</title>
    <link rel="stylesheet" href="../../dist/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>

<body class="ud-app-shell">

    <aside class="ud-app-shell-sidebar">
        <nav aria-label="Sections">
            <a class="ud-btn ud-btn-ghost" href="queue.html" aria-current="page">Queue</a>
            <a class="ud-btn ud-btn-ghost" href="schedule.html">Schedule</a>
            <a class="ud-btn ud-btn-ghost" href="inventory.html">Inventory</a>
        </nav>
    </aside>

    <header class="ud-app-shell-toolbar">
        <h1 class="ud-h2" style="margin: 0;">Production Queue</h1>
        <input class="ud-input" type="search" aria-label="Search orders" placeholder="Search orders" style="max-width: 16rem; margin-left: auto;">
        <button class="ud-btn ud-btn-outline" type="button">Export</button>
    </header>

    <main class="ud-app-shell-panes" style="--pane-columns: minmax(0, 1fr) 20rem;">

        <section class="ud-app-shell-pane" aria-label="Orders">
            <div class="ud-table-scroll" role="region" aria-label="Order table" tabindex="0">
            <table class="ud-table">
                <thead>
                    <tr>
                        <th>Order</th>
                        <th>Method</th>
                        <th>Status</th>
                        <th class="ud-table-numeric">Pieces</th>
                        <th><span class="ud-label">Actions</span></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>A-1042</td>
                        <td>Embroidery</td>
                        <td><span class="ud-badge">Ready</span></td>
                        <td class="ud-table-numeric">48</td>
                        <td><button class="ud-btn ud-btn-ghost" type="button">Open</button></td>
                    </tr>
                    <tr>
                        <td>A-1043</td>
                        <td>DTF</td>
                        <td><span class="ud-badge">Waiting on art</span></td>
                        <td class="ud-table-numeric">120</td>
                        <td><button class="ud-btn ud-btn-ghost" type="button">Open</button></td>
                    </tr>
                    <tr>
                        <td>A-1044</td>
                        <td>Embroidery</td>
                        <td><span class="ud-badge">Ready</span></td>
                        <td class="ud-table-numeric">12</td>
                        <td><button class="ud-btn ud-btn-ghost" type="button">Open</button></td>
                    </tr>
                </tbody>
            </table>
            </div>
        </section>

        <section class="ud-app-shell-pane" aria-label="Details" style="display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-3);">
            <button class="ud-pressable ud-card" type="button">
                <span class="ud-h3">A-1042</span>
                <span class="ud-label">Embroidery, 48 pieces</span>
            </button>
            <textarea class="ud-input" aria-label="Production note" placeholder="Production note"></textarea>
            <button class="ud-btn ud-btn-primary" type="button">Release A-1042</button>
            <div class="ud-empty-state">
                <h2 class="ud-h3">No blocked orders</h2>
                <p class="ud-label">Orders waiting on material show up here.</p>
                <button class="ud-btn ud-btn-secondary" type="button">Refresh</button>
            </div>
        </section>

    </main>

</body>
</html>
